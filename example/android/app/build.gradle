plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.tradplus_sdk_example"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()
    }

    defaultConfig {
        applicationId = "com.unstall.meetdeleteapp"
        minSdk = 25
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled = true
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        resources {
            excludes += [
                'META-INF/proguard/androidx-annotations.pro',
                'META-INF/com.android.tools/proguard/coroutines.pro',
            ]
        }
    }
}

dependencies {
    implementation 'androidx.multidex:multidex:2.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.3.0-alpha02'
    implementation 'com.google.code.gson:gson:2.8.6'

    // TradPlus
    implementation 'com.tradplusad:tradplus:15.4.0.1'
    // Admob
    implementation 'com.google.android.gms:play-services-ads:24.9.0'
    implementation 'com.tradplusad:tradplus-googlex:2.15.4.0.1'
    // Meta
    implementation 'com.facebook.android:audience-network-sdk:6.20.0'
    implementation 'com.tradplusad:tradplus-facebook:1.15.4.0.1'
    // Applovin
    implementation 'com.applovin:applovin-sdk:13.3.1'
    implementation 'com.tradplusad:tradplus-applovin:9.15.4.0.1'
    implementation 'com.google.android.gms:play-services-ads-identifier:17.0.0'
    // Mintegral
    implementation 'com.tradplusad:tradplus-mintegralx_overseas:18.15.4.0.1'
    implementation 'com.mbridge.msdk.oversea:mbridge_android_sdk:17.0.51'
}

flutter {
    source '../..'
}
